all:
  vars:
    # The generated inventory is assumed to be used from the clab host.
    # Hence no http proxy should be used. Therefore we make sure the http
    # module does not attempt using any global http proxy.
    ansible_httpapi_use_proxy: false
  children:
    linux:
      hosts:
        clab-lab3-PC1:
          ansible_host: 192.168.100.8
        clab-lab3-SGI-PRISM:
          ansible_host: 192.168.100.9
    vr-ros:
      vars:
        # ansible_connection: set ansible_connection variable if required
        ansible_user: admin
        ansible_password: admin
      hosts:
        clab-lab3-R01.HKI:
          ansible_host: 192.168.100.4
        clab-lab3-R01.LBN:
          ansible_host: 192.168.100.7
        clab-lab3-R01.LND:
          ansible_host: 192.168.100.3
        clab-lab3-R01.MSK:
          ansible_host: 192.168.100.6
        clab-lab3-R01.NY:
          ansible_host: 192.168.100.2
        clab-lab3-R01.SPB:
          ansible_host: 192.168.100.5